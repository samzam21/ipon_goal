<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracking Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-6 font-sans antialiased">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="mb-8 border-b border-slate-100 pb-5">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">Financial Entry Portal</h1>
            <p class="text-sm text-slate-500 mt-1">Record and synchronize daily cash flow and expenditures.</p>
        </div>

        <form id="expenseForm" class="space-y-5">
            <!-- Accountable Party -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Accountable Party</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setPerson('User 1')" id="btnUser1" class="py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none">User 1</button>
                    <button type="button" onclick="setPerson('User 2')" id="btnUser2" class="py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none">User 2</button>
                </div>
                <input type="hidden" id="person" value="User 1">
            </div>

            <!-- Transaction Type (Expense vs Income) -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Transaction Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setType('expense')" id="btnExpense" class="py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none">Expense</button>
                    <button type="button" onclick="setType('income')" id="btnIncome" class="py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none">Income</button>
                </div>
                <input type="hidden" id="entryType" value="expense">
            </div>

            <!-- Transaction Date Picker -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Transaction Date</label>
                <input type="date" id="date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
            </div>

            <!-- Item Description -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Description / Source</label>
                <input type="text" id="item" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition" placeholder="e.g., Grocery Supplies / Salary">
            </div>

            <!-- Category -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Category</label>
                <select id="category" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition">
                    <option value="Food & Groceries">Food & Groceries</option>
                    <option value="Bills & Utilities">Bills & Utilities</option>
                    <option value="Transport">Transport</option>
                    <option value="Leisure & Entertainment">Leisure & Entertainment</option>
                    <option value="Salary / Earnings">Salary / Earnings</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Amount (PHP)</label>
                <input type="number" step="0.01" id="amount" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-slate-900 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition" placeholder="0.00">
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition shadow-md shadow-blue-500/20 focus:outline-none">
                    Submit Entry
                </button>
            </div>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        function setPerson(name) {
            document.getElementById('person').value = name;
            const btnUser1 = document.getElementById('btnUser1');
            const btnUser2 = document.getElementById('btnUser2');
            
            if(name === 'User 1') {
                btnUser1.className = "py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none";
                btnUser2.className = "py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none";
            } else {
                btnUser2.className = "py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none";
                btnUser1.className = "py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none";
            }
        }

        function setType(type) {
            document.getElementById('entryType').value = type;
            const btnExpense = document.getElementById('btnExpense');
            const btnIncome = document.getElementById('btnIncome');
            
            if(type === 'expense') {
                btnExpense.className = "py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none";
                btnIncome.className = "py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none";
            } else {
                btnIncome.className = "py-2.5 px-4 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-sm font-medium transition focus:outline-none";
                btnExpense.className = "py-2.5 px-4 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium transition focus:outline-none";
            }
        }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVjORyOjZ-407NWkoKXKur8f8cGG5qGaSyxR7D2HMF9_CZzR6APnP94bmfthVsEZZd/exec";

        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            const formData = new URLSearchParams({
                person: document.getElementById('person').value,
                type: document.getElementById('entryType').value,
                date: document.getElementById('date').value,
                item: document.getElementById('item').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value
            });

            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";
            statusMessage.classList.add('hidden');

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                statusMessage.textContent = "Record successfully synchronized.";
                statusMessage.className = "mt-4 text-center text-sm font-medium text-blue-600";
                statusMessage.classList.remove('hidden');
                
                document.getElementById('expenseForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                setPerson('User 1');
                setType('expense');
            } catch (error) {
                statusMessage.textContent = "Transmission failed. Please verify network status.";
                statusMessage.className = "mt-4 text-center text-sm font-medium text-rose-600";
                statusMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Entry";
            }
        });
    </script>
</body>
</html>
